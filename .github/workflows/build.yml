name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-release:
    name: Build Signed Release APK (API 26+)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Release Signing Keystore
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SECRET_KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "Using repository release keystore from GitHub Secrets..."
            echo "$SECRET_KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${SECRET_STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${SECRET_KEY_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "Generating release signing keystore (alias: upload) for signed app-release.apk..."
            REL_PASS="weather_release_2026"
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -storetype PKCS12 \
              -storepass "$REL_PASS" \
              -keypass "$REL_PASS" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Antonee, OU=Mobile, O=Antonee Weather, L=City, S=State, C=US"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${REL_PASS}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${REL_PASS}" >> "$GITHUB_ENV"
          fi

      - name: Build Signed Release APK (assembleRelease)
        run: gradle assembleRelease

      - name: Verify Signed app-release.apk
        run: |
          ls -lh app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -verbose -certs app/build/outputs/apk/release/app-release.apk | head -n 30

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
